<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CeramicTransitions: Firing Journey &amp; Crystal Graphs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #1E1B4B; color: #F59E0B; font-family: 'IBM Plex Mono', monospace; min-height: 100%; }
    .page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 1.1rem; letter-spacing: .07em; margin-bottom: 1.5rem; color: #fcd34d; }
    h1 a { color: #fcd34d; text-decoration: none; }
    h1 a:hover { text-decoration: underline; }
    .nav { display: flex; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .nav a { color: #818cf8; font-size: .8rem; text-decoration: none; letter-spacing: .04em; }
    .nav a:hover { color: #c4b5fd; text-decoration: underline; }
    .section { margin-bottom: 2.5rem; }
    .section h2 { font-size: .85rem; letter-spacing: .07em; text-transform: uppercase; color: #F59E0B; margin-bottom: .6rem; }
    .graph-wrap { background: #131316; border: 1px solid #312e81; border-radius: 4px; overflow: hidden; }
    .hint { font-size: .72rem; color: #475569; margin-top: .4rem; }
    /* SVG node + edge styles */
    .node-phase { fill: #1e1b4b; stroke: #6366f1; stroke-width: 1.5; transition: fill .15s; }
    .node-phase:hover { fill: #312e81; cursor: default; }
    .lbl-phase { fill: #f59e0b; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-anchor: middle; pointer-events: none; }
    .lbl-temp  { fill: #64748b;  font-size: 10px; font-family: 'IBM Plex Mono', monospace; text-anchor: middle; pointer-events: none; }
    .edge-phase { stroke: #4f46e5; stroke-width: 1.8; marker-end: url(#arr); }
    /* tooltip */
    .tip { position: fixed; background: #0f172a; color: #f8fafc; border: 1px solid #334155;
           border-radius: 3px; padding: 5px 9px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
           pointer-events: none; display: none; z-index: 99; white-space: nowrap; max-width: 260px; white-space: normal; }
  </style>
</head>
<body>
<div class="page">
  <h1><a href="index.html">ceramicTransitions</a> — Firing Journey &amp; Crystal Graphs</h1>
  <nav class="nav">
    <a href="index.html">← 3D Viewer</a>
    <a href="lattice.html">Gallery</a>
  </nav>

  <!-- 1. Firing Journey -->
  <div class="section">
    <h2>Firing Journey — ceramic phase transitions by temperature</h2>
    <div class="graph-wrap">
      <svg id="firing-svg" viewBox="0 0 900 200" style="width:100%;display:block;" aria-label="Firing journey network from room temperature to mature ceramic"></svg>
    </div>
    <p class="hint">Hover nodes for phase notes · temperatures in °C</p>
  </div>

  <!-- 2. Crystal Structure -->
  <div class="section">
    <h2>Crystal Structure — NaCl (rocksalt) schematic</h2>
    <div class="graph-wrap">
      <canvas id="crystal-canvas" width="900" height="280" style="width:100%;display:block;" aria-label="NaCl crystal bond network, draggable"></canvas>
    </div>
    <p class="hint">Drag atoms to rearrange · bond lengths schematic</p>
  </div>
</div>

<div class="tip" id="tip"></div>

<script>
// ── 1. FIRING JOURNEY ────────────────────────────────────────────────────────
(function () {
  // Phases in temperature order (physically correct firing curve)
  const phases = [
    { id: 'start',         label: 'Room Temp',        temp: 25,   note: 'Clay as formed; pore water present' },
    { id: 'quartz',        label: 'Quartz Inv.',       temp: 573,  note: 'α⇌β SiO₂ at 573 °C — rapid, reversible.\nCritical on cooling; too fast = dunting cracks.' },
    { id: 'bisque',        label: 'Bisque',            temp: 950,  note: 'Organic burnout complete; clay converts to metakaolin → spinel → mullite range.' },
    { id: 'vitrification', label: 'Vitrification',     temp: 1230, note: 'Feldspar / flux melts; glass phase fills pores. Translucency begins.' },
    { id: 'mature',        label: 'Mature',            temp: 1280, note: 'Peak density. Excess firing → bloating / slumping.' },
  ];
  const edges = [
    ['start','quartz'], ['quartz','bisque'], ['bisque','vitrification'], ['vitrification','mature']
  ];

  const svg = document.getElementById('firing-svg');
  const ns  = 'http://www.w3.org/2000/svg';
  const W = 900, H = 200, PAD = 70, R = 34;
  const stepX = (W - PAD * 2) / (phases.length - 1);
  const midY  = H / 2;

  // defs
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = `
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#4f46e5"/>
    </marker>`;
  svg.appendChild(defs);

  const pos = {};
  phases.forEach((p, i) => { pos[p.id] = { x: PAD + i * stepX, y: midY }; });

  // edges
  edges.forEach(([a, b]) => {
    const pa = pos[a], pb = pos[b];
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    const el = document.createElementNS(ns, 'line');
    el.setAttribute('x1', pa.x + ux * R);
    el.setAttribute('y1', pa.y + uy * R);
    el.setAttribute('x2', pb.x - ux * (R + 7));
    el.setAttribute('y2', pb.y - uy * (R + 7));
    el.setAttribute('class', 'edge-phase');
    svg.appendChild(el);
  });

  const tip = document.getElementById('tip');

  // nodes
  phases.forEach(p => {
    const { x, y } = pos[p.id];
    const g = document.createElementNS(ns, 'g');

    const circ = document.createElementNS(ns, 'circle');
    circ.setAttribute('cx', x); circ.setAttribute('cy', y); circ.setAttribute('r', R);
    circ.setAttribute('class', 'node-phase');
    g.appendChild(circ);

    // multi-word label: split on space
    const words = p.label.split(' ');
    const lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('class', 'lbl-phase');
    words.forEach((w, i) => {
      const ts = document.createElementNS(ns, 'tspan');
      ts.setAttribute('x', x);
      ts.setAttribute('dy', i === 0 ? `${-(words.length - 1) * 7}` : '14');
      ts.textContent = w;
      lbl.appendChild(ts);
    });
    lbl.setAttribute('y', y);
    g.appendChild(lbl);

    // temperature label below node
    const tl = document.createElementNS(ns, 'text');
    tl.setAttribute('x', x); tl.setAttribute('y', y + R + 13);
    tl.setAttribute('class', 'lbl-temp');
    tl.textContent = p.temp + ' °C';
    g.appendChild(tl);

    g.addEventListener('mouseenter', () => {
      circ.setAttribute('filter', 'drop-shadow(0 0 6px #6366f1)');
      tip.style.display = 'block';
      tip.textContent = p.note;
    });
    g.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY - 36) + 'px';
    });
    g.addEventListener('mouseleave', () => {
      circ.removeAttribute('filter');
      tip.style.display = 'none';
    });

    svg.appendChild(g);
  });
})();

// ── 2. CRYSTAL — canvas force simulation ─────────────────────────────────────
(function () {
  const canvas = document.getElementById('crystal-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const nodes = [
    { id:'A', label:'Na⁺', type:'na', x:W*.33, y:H*.33, vx:0, vy:0, r:22 },
    { id:'B', label:'Cl⁻', type:'cl', x:W*.67, y:H*.33, vx:0, vy:0, r:26 },
    { id:'C', label:'Na⁺', type:'na', x:W*.67, y:H*.67, vx:0, vy:0, r:22 },
    { id:'D', label:'Cl⁻', type:'cl', x:W*.33, y:H*.67, vx:0, vy:0, r:26 },
  ];
  const bonds = [['A','B'],['B','C'],['C','D'],['D','A'],['A','C'],['B','D']];
  const byId  = new Map(nodes.map(n => [n.id, n]));

  const REST = 160, K_SP = 0.014, K_REP = 22000, DAMP = 0.86;
  let dragged = null, offX = 0, offY = 0;

  function step() {
    bonds.forEach(([ai, bi]) => {
      const a = byId.get(ai), b = byId.get(bi);
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.hypot(dx, dy) || .01;
      const f  = K_SP * (d - REST);
      const ux = dx / d, uy = dy / d;
      if (a !== dragged) { a.vx += f*ux; a.vy += f*uy; }
      if (b !== dragged) { b.vx -= f*ux; b.vy -= f*uy; }
    });
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const d  = Math.hypot(dx,dy) || .01;
        const f  = K_REP / (d*d);
        const ux = dx/d, uy = dy/d;
        if (a !== dragged) { a.vx -= f*ux; a.vy -= f*uy; }
        if (b !== dragged) { b.vx += f*ux; b.vy += f*uy; }
      }
    }
    nodes.forEach(n => {
      if (n === dragged) return;
      n.vx += (W/2 - n.x) * .0006;
      n.vy += (H/2 - n.y) * .0006;
      n.vx *= DAMP; n.vy *= DAMP;
      n.x = Math.max(n.r+2, Math.min(W-n.r-2, n.x + n.vx));
      n.y = Math.max(n.r+2, Math.min(H-n.r-2, n.y + n.vy));
    });
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#131316';
    ctx.fillRect(0,0,W,H);

    // bonds
    bonds.forEach(([ai,bi]) => {
      const a = byId.get(ai), b = byId.get(bi);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.stroke();
    });

    // atoms
    nodes.forEach(n => {
      const isNa = n.type === 'na';
      ctx.shadowBlur  = 14;
      ctx.shadowColor = isNa ? '#3b82f6' : '#10b981';
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle   = isNa ? '#1e3a8a' : '#064e3b'; ctx.fill();
      ctx.strokeStyle = isNa ? '#60a5fa' : '#34d399'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.shadowBlur  = 0;
      ctx.fillStyle   = '#f0fdf4';
      ctx.font        = "500 13px 'IBM Plex Mono',monospace";
      ctx.textAlign   = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.label, n.x, n.y);
    });
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }
  loop();

  // pointer helpers
  function hitTest(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const sx = W / r.width, sy = H / r.height;
    const px = (cx - r.left)*sx, py = (cy - r.top)*sy;
    return nodes.find(n => Math.hypot(n.x-px, n.y-py) < n.r + 4) || null;
  }
  function toCanvas(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return [(cx-r.left)*W/r.width, (cy-r.top)*H/r.height];
  }

  canvas.addEventListener('mousedown', e => {
    const n = hitTest(e.clientX, e.clientY);
    if (n) { dragged = n; const [px,py] = toCanvas(e.clientX, e.clientY); offX = px-n.x; offY = py-n.y; canvas.style.cursor='grabbing'; }
  });
  canvas.addEventListener('mousemove', e => {
    if (dragged) {
      const [px,py] = toCanvas(e.clientX, e.clientY);
      dragged.x = px-offX; dragged.y = py-offY; dragged.vx=0; dragged.vy=0;
    } else {
      canvas.style.cursor = hitTest(e.clientX, e.clientY) ? 'grab' : 'default';
    }
  });
  canvas.addEventListener('mouseup',    () => { dragged=null; canvas.style.cursor='default'; });
  canvas.addEventListener('mouseleave', () => { dragged=null; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0], n = hitTest(t.clientX, t.clientY);
    if (n) { dragged=n; const [px,py]=toCanvas(t.clientX,t.clientY); offX=px-n.x; offY=py-n.y; }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!dragged) return;
    const t = e.touches[0]; const [px,py]=toCanvas(t.clientX,t.clientY);
    dragged.x=px-offX; dragged.y=py-offY; dragged.vx=0; dragged.vy=0;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { dragged=null; });
})();
</script>
</body>
</html>
