<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>High-Temperature Ceramic Lattices — UHTC · TBC · EBC · CMC</title>
<meta name="description" content="Lattice gallery for high-temperature ceramics: UHTCs, thermal/environmental barrier coatings, MAX phases, refractory oxides, RE-silicates. Filter by material class and service temperature.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg:#060608; --surface:#0e0e12; --border:#1e1e28; --text:#c8c8d0;
  --text-dim:#5a5a68; --accent:#c4826e;
  --mono:'IBM Plex Mono','Consolas',monospace; --sans:'IBM Plex Sans','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}

canvas{display:block;position:fixed;top:0;left:0;z-index:0;}

/* ── Header bar ──────────────────────────────────── */
#header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(6,6,8,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
#header h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px;}
#header h1 span{color:var(--accent);font-weight:400;}
#header .sub{font-size:10px;color:var(--text-dim);font-family:var(--mono);margin-left:10px;}

/* ── Structure strip ─────────────────────────────── */
#strip{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;gap:0;background:rgba(6,6,8,.9);backdrop-filter:blur(12px);border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.strip-btn{flex:0 0 auto;padding:10px 16px;background:none;border:none;cursor:pointer;text-align:center;border-top:2px solid transparent;transition:all .2s;}
.strip-btn:hover{background:rgba(196,130,110,.06);}
.strip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:rgba(196,130,110,.08);}
.strip-btn.active{border-top-color:var(--accent);background:rgba(196,130,110,.1);}
.strip-name{font-size:11px;font-family:var(--mono);color:var(--text);display:block;white-space:nowrap;}
.strip-formula{font-size:9px;color:var(--text-dim);font-family:var(--mono);display:block;margin-top:1px;}
.strip-btn.active .strip-name{color:var(--accent);}

/* ── Info overlay ────────────────────────────────── */
#info{position:fixed;top:56px;right:20px;z-index:15;background:rgba(10,10,14,.92);border:1px solid var(--border);border-radius:8px;padding:14px 18px;backdrop-filter:blur(8px);min-width:220px;transition:opacity .3s;}
#info .name{font-size:18px;font-weight:700;color:#fff;margin-bottom:2px;}
#info .formula{font-size:13px;font-family:var(--mono);color:var(--text-dim);margin-bottom:8px;}
#info .stat{font-size:11px;font-family:var(--mono);color:var(--text-dim);line-height:1.7;}
#info .stat b{color:var(--text);font-weight:600;}
#info .system{font-size:10px;font-family:var(--mono);color:var(--accent);margin-bottom:4px;}

/* ── Controls ────────────────────────────────────── */
#controls{position:fixed;top:56px;left:20px;z-index:15;background:rgba(10,10,14,.92);border:1px solid var(--border);border-radius:8px;padding:10px 14px;backdrop-filter:blur(8px);}
#controls label{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--text-dim);cursor:pointer;padding:2px 0;}
#controls label:hover{color:var(--text);}
#controls label input{accent-color:var(--accent);}
.slider-row{display:flex;align-items:center;gap:6px;font-size:10px;font-family:var(--mono);color:var(--text-dim);padding:2px 0;}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);height:3px;}
.slider-row .val{min-width:20px;text-align:right;color:var(--text);}

/* ── Legend ───────────────────────────────────────── */
#legend{position:fixed;bottom:60px;left:20px;z-index:15;background:rgba(10,10,14,.88);border:1px solid var(--border);border-radius:6px;padding:8px 12px;backdrop-filter:blur(8px);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10px;font-family:var(--mono);color:var(--text-dim);padding:1px 0;}
.legend-swatch{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.12);}

/* ── Loading ─────────────────────────────────────── */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;flex-direction:column;gap:12px;transition:opacity .4s;}
#loading.done{opacity:0;pointer-events:none;}
#loading-text{font-size:13px;color:var(--text-dim);font-family:var(--mono);}
#loading-bar{width:280px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
#loading-fill{height:100%;background:var(--accent);width:0%;transition:width .3s;}

@media(max-width:640px){
  .strip-btn{padding:8px 10px;}
  .strip-name{font-size:10px;}
  #info{right:10px;left:10px;min-width:auto;}
  #controls{left:10px;right:10px;}
  #header h1{font-size:13px;}
  #header .sub{display:none;}
  #legend{display:none;}
}

/* ── Filter bar ──────────────────────────────────────────────── */
#filter-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:54px;z-index:21;display:flex;gap:6px;align-items:center;background:rgba(10,10,14,.92);border:1px solid var(--border);border-radius:18px;padding:5px 10px;backdrop-filter:blur(8px);}
#filter-input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:11px;width:180px;}
#filter-input::placeholder{color:var(--text-dim);}
#filter-count{font-size:9px;font-family:var(--mono);color:var(--text-dim);min-width:36px;text-align:right;}
#filter-clear{background:none;border:none;color:var(--text-dim);font-family:var(--mono);font-size:14px;cursor:pointer;padding:0 4px;line-height:1;}
#filter-clear:hover{color:var(--accent);}
.strip-btn.filtered-out{display:none !important;}

/* ── Fatal error overlay ─────────────────────────────────────── */
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(6,6,8,.96);z-index:300;padding:24px;text-align:center;}
#fatal.show{display:flex;}
#fatal h3{color:#e88c70;font-size:15px;}
#fatal p{color:var(--text-dim);font-family:var(--mono);font-size:11px;max-width:480px;line-height:1.5;}
#fatal button{margin-top:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:4px;cursor:pointer;}
#fatal button:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>

<div id="loading">
  <div id="loading-text">Loading crystal lattices…</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<div id="fatal" role="alert" aria-live="assertive">
  <h3>Could not load lattice data</h3>
  <p id="fatal-msg">The structure dataset failed to load. Check your connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>

<div id="filter-bar">
  <input id="filter-input" type="search" placeholder="Filter by name or formula…" autocomplete="off" spellcheck="false" aria-label="Filter structures">
  <select id="filter-class" style="background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-family:var(--mono);font-size:10px;padding:2px 4px;" aria-label="Material class">
    <option value="">All classes</option>
    <option value="UHTC">UHTC</option>
    <option value="TBC">TBC</option>
    <option value="EBC">EBC</option>
    <option value="CMC">CMC</option>
    <option value="max_phase">MAX</option>
    <option value="refractory_oxide">Refractory</option>
    <option value="silicate">Silicate</option>
    <option value="carbide">Carbide</option>
    <option value="nitride">Nitride</option>
    <option value="disilicide">Disilicide</option>
    <option value="polymorph_silica">SiO₂</option>
    <option value="high_entropy">HEC</option>
    <option value="mineral">Mineral</option>
    <option value="precursor">Precursor</option>
    <option value="carbonate">Carbonate</option>
    <option value="hydroxide">Hydroxide</option>
  </select>
  <input id="filter-temp" type="range" min="0" max="3500" step="100" value="0" style="width:90px;" aria-label="Minimum service temperature">
  <span id="filter-temp-val" style="font-size:9px;font-family:var(--mono);color:var(--text-dim);min-width:48px;">T≥0°C</span>
  <button id="filter-clear" title="Clear" aria-label="Clear filter">×</button>
  <span id="filter-count">—</span>
</div>

<div id="header">
  <div style="display:flex;align-items:baseline;gap:4px">
    <h1>High-Temperature Ceramic <span>Lattices</span></h1>
    <span class="sub" id="structure-count-sub">Loading structures…</span>
  </div>
  <div style="display:flex;gap:14px;align-items:center;">
    <a href="index.html" style="font-size:11px;font-family:monospace;color:#7ecfdf;text-decoration:none;opacity:.7;transition:opacity .2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7">← Crystal Viewer</a>
    <a href="transitions-graph.html" style="font-size:11px;font-family:monospace;color:#7ecfdf;text-decoration:none;opacity:.7;transition:opacity .2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7">Firing Graph</a>
    <a href="https://ceramic-micros.howell.help/" style="font-size:11px;font-family:monospace;color:#7ecfdf;text-decoration:none;opacity:.7;transition:opacity .2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7" title="Companion: diffusion kinetics in ceramics">↗ ceramic-micros</a>
  </div>
</div>

<div id="controls" role="region" aria-label="Display controls">
  <label><input type="checkbox" id="chk-bonds" checked aria-label="Toggle bonds"> Bonds</label>
  <label><input type="checkbox" id="chk-cell" checked aria-label="Toggle unit cells"> Unit cells</label>
  <label><input type="checkbox" id="chk-rotate" aria-label="Toggle auto-rotate"> Auto-rotate</label>
  <div class="slider-row">
    <span>Atom</span>
    <input type="range" id="sl-atom" min="0.2" max="1.8" step="0.05" value="0.55" aria-label="Atom size scale">
    <span class="val" id="sl-atom-val">0.55</span>
  </div>
  <div class="slider-row">
    <span>Repeat</span>
    <input type="range" id="sl-repeat" min="1" max="12" step="1" value="3" aria-label="Lattice repeat count">
    <span class="val" id="sl-repeat-val">3×</span>
  </div>
</div>

<div id="info" role="region" aria-label="Structure information" aria-live="polite">
  <div class="system" id="info-system"></div>
  <div class="name" id="info-name">α-Quartz</div>
  <div class="formula" id="info-formula">SiO₂</div>
  <div class="stat" id="info-stat"></div>
</div>

<div id="legend" role="region" aria-label="Element legend"></div>
<div id="strip" role="tablist" aria-label="Crystal structures"></div>

<script type="importmap">
{
  "imports": {
    "three":           "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/addons/":   "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Constants ─────────────────────────────────────────────── */
const DATA_URL = 'data/crystal_vr.json';
const ATOM_SEGS = 20;
const BOND_SEGS = 6;
const BOND_R    = 0.055;

/* ── State ─────────────────────────────────────────────────── */
let scene, camera, renderer, controls, clock;
let data = null;
let currentIdx = 0;
let atomScale  = 0.55;
let showBonds  = true;
let showCell   = true;
let autoRotate = false;
let repeatCount = 3;        // how many unit cells to tile per axis

let crystalGroup;            // holds current crystal
let atomMeshes = [];
let bondMesh   = null;
let cellLine   = null;

let elemColors = {};
let elemRadii  = {};
let bondColorMap = {};

/* ── Helpers ───────────────────────────────────────────────── */
const sphereCache = {};
function getGeo(r) {
  const k = r.toFixed(3);
  if (!sphereCache[k]) sphereCache[k] = new THREE.SphereGeometry(r, ATOM_SEGS, ATOM_SEGS);
  return sphereCache[k];
}

/* ── Init ──────────────────────────────────────────────────── */
async function init() {
  clock = new THREE.Clock();
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060608);
  scene.fog = new THREE.FogExp2(0x060608, 0.008);

  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
  camera.position.set(0, 12, 35);

  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.target.set(0, 0, 0);
  controls.minDistance = 4;
  controls.maxDistance = 120;

  crystalGroup = new THREE.Group();
  scene.add(crystalGroup);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.9);
  d1.position.set(12, 18, 12);
  scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x8899cc, 0.35);
  d2.position.set(-10, 6, -12);
  scene.add(d2);
  scene.add(new THREE.HemisphereLight(0x334466, 0x112233, 0.25));

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  await loadData();
  setupUI();
  animate();
}

  'SiC (fiber-reinforced)':{proto:'zincblende',params:{a:4.359},cation:'Si',anion:'C'},
  'SiC (reaction-bonded)':{proto:'zincblende',params:{a:4.359},cation:'Si',anion:'C'},
  'SiC (sintered)':{proto:'zincblende',params:{a:4.359},cation:'Si',anion:'C'},
  'Si3N4':{proto:'si3n4',params:{a:7.602,c:2.907},cation:'Si',anion:'N'},

function _normalizeFormula(f) {

    .replace(/\u2093/g, 'x')

function generateAtomsFromPrototype(s, elementsMap) {
  const entry = PROTOTYPE_TABLE[_normalizeFormula(s.formula)];
  if (!entry) return null;
  const def = PROTOTYPE_DEFS[entry.proto];
  if (!def) return null;
  const { params, cation, anion } = entry;
  const lat = def.lattice(params);
  const [Nx, Ny, Nz] = def.supercell;
  const cutoff = def.bondCutoff(params);

  const atoms = [];
  for (let i = 0; i < Nx; i++) for (let j = 0; j < Ny; j++) for (let k = 0; k < Nz; k++) {

      const u = b.fx + i, v = b.fy + j, w = b.fz + k;
      const x = u*lat[0][0] + v*lat[1][0] + w*lat[2][0];
      const y = u*lat[0][1] + v*lat[1][1] + w*lat[2][1];
      const z = u*lat[0][2] + v*lat[1][2] + w*lat[2][2];
      const el = (b.role === 'C') ? cation : anion;
      atoms.push({ e: el, x, y, z, r: _radiusFor(el, elementsMap), cn: 0 });

  let cx=0,cy=0,cz=0;
  for (const a of atoms) { cx+=a.x; cy+=a.y; cz+=a.z; }
  cx/=atoms.length; cy/=atoms.length; cz/=atoms.length;
  for (const a of atoms) { a.x-=cx; a.y-=cy; a.z-=cz; }
  const bonds = [], bondTypes = [];
  const cn = new Array(atoms.length).fill(0);

  for (let i = 0; i < atoms.length; i++) {
    for (let j = i+1; j < atoms.length; j++) {
      if (!allowHomo && atoms[i].e === atoms[j].e) continue;
      const dx=atoms[i].x-atoms[j].x, dy=atoms[i].y-atoms[j].y, dz=atoms[i].z-atoms[j].z;
      const d2 = dx*dx+dy*dy+dz*dz;
      if (d2 < cutoff2 && d2 > 1e-6) {

function ensureElementsCoverage(elementsMap) {

}
// Bond colors keyed by alphabetically-sorted pair (matches generator output).
const FALLBACK_BOND_COLORS = {
  'C-Hf':[0.62,0.70,0.78], 'C-Ta':[0.55,0.58,0.62], 'C-Zr':[0.60,0.72,0.80], 'C-Si':[0.70,0.70,0.55],
  'Hf-O':[0.85,0.55,0.45], 'O-Zr':[0.85,0.60,0.45],
  'B-Hf':[0.85,0.65,0.55], 'B-Zr':[0.90,0.70,0.55],
  'Al-N':[0.55,0.65,0.95], 'B-N':[0.75,0.78,0.95], 'B-B':[1.00,0.71,0.71],

    if (!gen) continue;
    s.atoms = gen.atoms; s.bonds = gen.bonds; s.bondTypes = gen.bondTypes;
    s.cellVectors = gen.cellVectors; s.supercell = gen.supercell;
    s.prototype = gen.prototype; s.proceduralFallback = true; s.isStub = false;

}

/* ── Data ──────────────────────────────────────────────────── */
function showFatal(msg) {
  const f = document.getElementById('fatal');
  const m = document.getElementById('fatal-msg');
  if (m && msg) m.textContent = msg;
  if (f) f.classList.add('show');
  const ld = document.getElementById('loading');
  if (ld) ld.style.display = 'none';
}
async function loadData() {
  const fill = document.getElementById('loading-fill');
  fill.style.width = '30%';
  let resp;
  try {
    resp = await fetch(DATA_URL, { cache: 'default' });
  } catch (e) {
    showFatal('Network error: ' + (e && e.message ? e.message : 'request failed') + ' · ' + DATA_URL);
    throw e;
  }
  if (!resp.ok) {
    showFatal('HTTP ' + resp.status + ' loading ' + DATA_URL);
    throw new Error('fetch failed: ' + resp.status);
  }
  try {
    data = await resp.json();
  } catch (e) {
    showFatal('Dataset is not valid JSON: ' + (e && e.message ? e.message : 'parse failed'));
    throw e;
  }

  // ── Dedupe + flag stubs (mirrors index.html normalization) ─────────────
  if (Array.isArray(data.structures)) {
    const seen = new Map();
    for (const s of data.structures) {
      const key = `${(s.name||'').trim()}|${(s.formula||'').trim()}`;
      const prev = seen.get(key);
      const aCount = (s.atoms && s.atoms.length) || 0;
      const pCount = prev ? ((prev.atoms && prev.atoms.length) || 0) : -1;
      if (!prev || aCount > pCount) seen.set(key, s);
    }
    data.structures = Array.from(seen.values());
    data.structures.forEach(s => {
      const cv = s.cellVectors;
      const hasCell = Array.isArray(cv) && cv.length >= 3 && Array.isArray(cv[0]) && cv[0].length >= 3;
      const hasAtoms = Array.isArray(s.atoms) && s.atoms.length > 0;
      s.isStub = !(hasCell && hasAtoms);
      if (!Array.isArray(s.atoms)) s.atoms = [];
      if (!Array.isArray(s.bonds)) s.bonds = [];
      if (!Array.isArray(s.supercell) || s.supercell.length !== 3) s.supercell = [1,1,1];
    });
    // Renderable structures are what this gallery can actually tile.
    data.renderableStructures = data.structures.filter(s => !s.isStub);
  }

  // ── Phase 2.5.1: procedural promotion of stubs ──────────────────────────
  ensureElementsCoverage(data.elements);
  if (data.bondColors && typeof data.bondColors === 'object') ensureBondColorsCoverage(data.bondColors);
  const _promotedCount = promoteStubsWithPrototypes(data.structures, data.elements);
  if (_promotedCount > 0) {
    console.log('[procedural] promoted ' + _promotedCount + ' stub(s) using prototype catalog');
    data.renderableStructures = data.structures.filter(s => !s.isStub);
  }
  data.renderableCount = data.renderableStructures.length;

  const total = data.structures.length;
  const renderable = data.renderableStructures.length;
  document.getElementById('structure-count-sub').textContent =
    renderable === total
      ? `${total} structures repeating in space`
      : `${renderable} of ${total} structures repeating in space · ${total - renderable} pending 3D models`;
  fill.style.width = '80%';

  for (const [sym, info] of Object.entries(data.elements)) {
    const c = info.color;
    elemColors[sym] = new THREE.Color(c[0], c[1], c[2]);
    elemRadii[sym]  = info.radius;
  }
  for (const [pair, c] of Object.entries(data.bondColors)) {
    bondColorMap[pair] = new THREE.Color(c[0], c[1], c[2]);
  }

  fill.style.width = '100%';
  setTimeout(() => document.getElementById('loading').classList.add('done'), 300);
}

/* ── UI ────────────────────────────────────────────────────── */
function setupUI() {
  // Strip buttons
  const strip = document.getElementById('strip');
  // Only renderable structures get strip buttons — stubs would crash the tile pipeline.
  const renderList = data.renderableStructures || data.structures;
  // Remap currentIdx to the renderable subset.
  data._renderIndexMap = renderList.map(s => data.structures.indexOf(s));
  renderList.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'strip-btn' + (i === 0 ? ' active' : '');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', `${s.name} (${s.formula})`);
    btn.dataset.name = (s.name||'').toLowerCase();
    btn.dataset.formula = (s.formula||'').toLowerCase();
    btn.dataset.system = (s.system||'').toLowerCase();
    btn.dataset.matclass = (s.material_class||'').toLowerCase();
    btn.dataset.servicetemp = (typeof s.service_temp_c === 'number') ? String(s.service_temp_c) : '';
    btn.innerHTML = `<span class="strip-name">${s.name}</span><span class="strip-formula">${s.formula}</span>`;
    btn.onclick = () => selectStructure(i);
    strip.appendChild(btn);
  });

  // Filter / search
  const fInput = document.getElementById('filter-input');
  const fCount = document.getElementById('filter-count');
  const fClear = document.getElementById('filter-clear');
  const updateFilterCount = () => {
    const all = strip.querySelectorAll('.strip-btn');
    const shown = strip.querySelectorAll('.strip-btn:not(.filtered-out)').length;
    fCount.textContent = shown + ' / ' + all.length;
  };
  const applyFilter = () => {
    const q = fInput.value.trim().toLowerCase();
    const cls = (document.getElementById('filter-class')?.value || '').toLowerCase();
    const minT = parseInt(document.getElementById('filter-temp')?.value || '0', 10);
    const tLabel = document.getElementById('filter-temp-val');
    if (tLabel) tLabel.textContent = 'T≥' + minT + '°C';
    strip.querySelectorAll('.strip-btn').forEach(b => {
      const textHit = !q || b.dataset.name.includes(q) || b.dataset.formula.includes(q) || b.dataset.system.includes(q);
      const classHit = !cls || b.dataset.matclass === cls;
      const st = b.dataset.servicetemp ? parseInt(b.dataset.servicetemp, 10) : 9999;
      const tempHit = st >= minT;
      b.classList.toggle('filtered-out', !(textHit && classHit && tempHit));
    });
    updateFilterCount();
  };
  fInput.addEventListener('input', applyFilter);
  document.getElementById('filter-class')?.addEventListener('change', applyFilter);
  document.getElementById('filter-temp')?.addEventListener('input', applyFilter);
  fClear.addEventListener('click', () => {
    fInput.value = '';
    const cs = document.getElementById('filter-class'); if (cs) cs.value = '';
    const ts = document.getElementById('filter-temp'); if (ts) ts.value = '0';
    applyFilter();
    fInput.focus();
  });
  updateFilterCount();

  // Checkboxes
  document.getElementById('chk-bonds').onchange = e => { showBonds = e.target.checked; if (bondMesh) bondMesh.visible = showBonds; };
  document.getElementById('chk-cell').onchange  = e => { showCell = e.target.checked; if (cellLine) cellLine.visible = showCell; };
  document.getElementById('chk-rotate').onchange = e => { autoRotate = e.target.checked; controls.autoRotate = autoRotate; controls.autoRotateSpeed = 1.2; };

  // Atom scale slider
  const slAtom = document.getElementById('sl-atom');
  slAtom.oninput = () => {
    atomScale = parseFloat(slAtom.value);
    document.getElementById('sl-atom-val').textContent = atomScale.toFixed(2);
    buildCrystal(currentIdx);
  };

  // Repeat slider
  const slRepeat = document.getElementById('sl-repeat');
  slRepeat.oninput = () => {
    repeatCount = parseInt(slRepeat.value);
    document.getElementById('sl-repeat-val').textContent = repeatCount + '×';
    buildCrystal(currentIdx);
  };

  // Build first
  selectStructure(0);
}

function selectStructure(idx) {
  currentIdx = idx;
  const btns = document.querySelectorAll('.strip-btn');
  btns.forEach((b, i) => {
    const on = (i === idx);
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  // Scroll active button into view (smooth, horizontal only)
  const active = btns[idx];
  if (active && typeof active.scrollIntoView === 'function') {
    active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  buildCrystal(idx);
  updateInfo(idx);
}

// Keyboard navigation: ←/→ cycle to prev/next visible (non-filtered) structure,
// Home/End jump to first/last visible, Esc clears the filter input.
document.addEventListener('keydown', (e) => {
  if (!data || !data.renderableStructures) return;
  const tag = (e.target && e.target.tagName) || '';
  const isText = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === 'Escape' && isText && e.target.id === 'filter-input') {
    e.target.value = '';
    e.target.dispatchEvent(new Event('input'));
    return;
  }
  if (isText) return; // don't hijack typing in the filter field
  const total = data.renderableStructures.length;
  if (total === 0) return;
  const btns = Array.from(document.querySelectorAll('.strip-btn'));
  const visible = btns.map((b, i) => ({ b, i })).filter(o => !o.b.classList.contains('filtered-out'));
  if (visible.length === 0) return;
  const visIdx = visible.findIndex(o => o.i === currentIdx);
  let next = null;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    next = visible[(visIdx + 1 + visible.length) % visible.length].i;
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    next = visible[(visIdx - 1 + visible.length) % visible.length].i;
  } else if (e.key === 'Home') {
    next = visible[0].i;
  } else if (e.key === 'End') {
    next = visible[visible.length - 1].i;
  } else {
    return;
  }
  e.preventDefault();
  selectStructure(next);
});

function _currentStructure(idx) {
  // Lattice gallery only iterates renderable structures.
  const list = data.renderableStructures || data.structures;
  return list[idx];
}

function updateInfo(idx) {
  const s = _currentStructure(idx);
  document.getElementById('info-name').textContent    = s.name;
  document.getElementById('info-formula').textContent  = s.formula;
  document.getElementById('info-system').textContent   = s.system || '';

  const cv = s.cellVectors;
  const va = Math.sqrt(cv[0][0]**2 + cv[0][1]**2 + cv[0][2]**2).toFixed(2);
  const vb = Math.sqrt(cv[1][0]**2 + cv[1][1]**2 + cv[1][2]**2).toFixed(2);
  const vc = Math.sqrt(cv[2][0]**2 + cv[2][1]**2 + cv[2][2]**2).toFixed(2);

  // Count unique elements
  const elems = new Set(s.atoms.map(a => a.e));
  // Count atoms per unit cell (total / supercell product)
  const sc = s.supercell;
  const cellAtoms = Math.round(s.atoms.length / (sc[0] * sc[1] * sc[2]));

  let html = '';
  if (s.proceduralFallback) {
    html += `<div style="margin:0 0 6px;padding:5px 7px;border-radius:3px;background:#1a2a35;color:#8acfd9;font-size:10px;line-height:1.45;border-left:3px solid #3a9cb4">`
          + `Procedural approximation · lattice + bond topology from canonical crystallography. Phase 3 will replace with simulation-derived coordinates.`
          + `</div>`;
  }
  html += `<b>${cellAtoms}</b> atoms per unit cell<br>`
        + `<b>${elems.size}</b> elements: ${[...elems].join(', ')}<br>`
        + `Cell: <b>${va}</b> × <b>${vb}</b> × <b>${vc}</b> Å<br>`
        + `Tiled: <b>${repeatCount}×${repeatCount}×${repeatCount}</b> cells<br>`
        + `Total atoms: <b>${(cellAtoms * repeatCount**3).toLocaleString()}</b>`;
  if (Array.isArray(s.info) && s.info.length) {
    const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
    html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:10px;color:var(--text-dim);line-height:1.5">`;
    s.info.forEach(line => { html += esc(line) + '<br>'; });
    html += `</div>`;
  }
  document.getElementById('info-stat').innerHTML = html;
}

/* ── Build Crystal (Tiled) ─────────────────────────────────── */
function clearCrystal() {
  while (crystalGroup.children.length) {
    const c = crystalGroup.children[0];
    crystalGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (c.material.map) c.material.map.dispose();
      c.material.dispose();
    }
  }
  atomMeshes = [];
  bondMesh = null;
  cellLine = null;
}

function buildCrystal(idx) {
  clearCrystal();
  const s = _currentStructure(idx);
  const cv = s.cellVectors;
  const sc = s.supercell;
  const va = new THREE.Vector3(...cv[0]);
  const vb = new THREE.Vector3(...cv[1]);
  const vc = new THREE.Vector3(...cv[2]);

  // The existing atoms are positioned in a supercell grid.
  // We need to extract the UNIT CELL atoms, then tile them repeatCount times.
  // Unit cell atoms = total atoms / supercell product
  // They sit in the first unit cell (indices 0..cellAtomCount-1 approximately)
  // Actually, the atoms in the data are already positioned in space for the supercell.
  // To tile, we take ALL atoms and replicate the whole supercell block.
  // Simpler: extract atom positions modulo the unit cell, then tile.

  // Strategy: Take all atoms, compute their positions relative to the supercell.
  // The supercell spans from -center to +center. We'll retile from scratch.

  // Full supercell extent in each lattice direction
  const fullA = va.clone().multiplyScalar(sc[0]);
  const fullB = vb.clone().multiplyScalar(sc[1]);
  const fullC = vc.clone().multiplyScalar(sc[2]);
  const fullCenter = new THREE.Vector3()
    .addScaledVector(va, sc[0]/2)
    .addScaledVector(vb, sc[1]/2)
    .addScaledVector(vc, sc[2]/2);

  // Original atoms are centered (offset by -fullCenter)
  // To get unit-cell-relative: add fullCenter, then mod by unit cell
  // But easier: just take the existing atoms from ONE unit cell slice, then tile.

  // Extract atoms belonging to the first unit cell (0 <= fractional < 1/sc)
  // Actually simplest: use all atoms as the "motif" and just offset copies of the whole supercell.

  // Even simpler: the data IS a supercell. For tiling, we need unit cell atoms.
  // Let's use the inverse: divide atom positions by lattice vectors to get fractional,
  // keep only those in [0,1) of a single unit cell, then tile.

  // Build lattice matrix for fractional coords
  const M = new THREE.Matrix3();
  M.set(
    va.x, vb.x, vc.x,
    va.y, vb.y, vc.y,
    va.z, vb.z, vc.z,
  );
  const Minv = M.clone().invert();

  // Get unit cell atoms: convert to fractional, wrap to [0,1), deduplicate
  const unitAtoms = [];
  const seen = new Set();
  const tolerance = 0.02;

  for (const a of s.atoms) {
    // Current position is already centered -> shift back
    const px = a.x + fullCenter.x;
    const py = a.y + fullCenter.y;
    const pz = a.z + fullCenter.z;

    // To fractional
    const v = new THREE.Vector3(px, py, pz);
    v.applyMatrix3(Minv);

    // Wrap to [0,1)
    let fx = ((v.x % 1) + 1) % 1;
    let fy = ((v.y % 1) + 1) % 1;
    let fz = ((v.z % 1) + 1) % 1;

    // Snap near-boundary
    if (fx > 1 - tolerance) fx = 0;
    if (fy > 1 - tolerance) fy = 0;
    if (fz > 1 - tolerance) fz = 0;

    const key = `${a.e}_${fx.toFixed(2)}_${fy.toFixed(2)}_${fz.toFixed(2)}`;
    if (!seen.has(key)) {
      seen.add(key);
      unitAtoms.push({ e: a.e, r: a.r, fx, fy, fz });
    }
  }

  // Now tile: generate repeatCount^3 copies of unit cell atoms
  const R = repeatCount;
  const tiledAtoms = [];
  const tileCenter = new THREE.Vector3()
    .addScaledVector(va, R/2)
    .addScaledVector(vb, R/2)
    .addScaledVector(vc, R/2);

  for (let ix = 0; ix < R; ix++) {
    for (let iy = 0; iy < R; iy++) {
      for (let iz = 0; iz < R; iz++) {
        for (const ua of unitAtoms) {
          const x = (ix + ua.fx) * va.x + (iy + ua.fy) * vb.x + (iz + ua.fz) * vc.x - tileCenter.x;
          const y = (ix + ua.fx) * va.y + (iy + ua.fy) * vb.y + (iz + ua.fz) * vc.y - tileCenter.y;
          const z = (ix + ua.fx) * va.z + (iy + ua.fy) * vb.z + (iz + ua.fz) * vc.z - tileCenter.z;
          tiledAtoms.push({ e: ua.e, r: ua.r, x, y, z });
        }
      }
    }
  }

  // Build instanced meshes by element
  buildTiledAtoms(tiledAtoms);

  // Build bonds (find bonded pairs within cutoff)
  buildTiledBonds(tiledAtoms, s);

  // Build cell wireframe for the tiled grid
  buildTiledCellWireframe(va, vb, vc, R, tileCenter);

  // Build legend
  buildLegend(tiledAtoms);

  // Adjust camera
  const extent = Math.max(
    va.length() * R,
    vb.length() * R,
    vc.length() * R,
  );
  controls.target.set(0, 0, 0);
  const dist = extent * 0.9 + 8;
  camera.position.set(dist * 0.4, dist * 0.3, dist * 0.7);
  controls.update();
}

function buildTiledAtoms(atoms) {
  const byElem = {};
  atoms.forEach((a, i) => {
    if (!byElem[a.e]) byElem[a.e] = [];
    byElem[a.e].push(a);
  });

  const dummy = new THREE.Object3D();
  const unitGeo = new THREE.SphereGeometry(1, ATOM_SEGS, ATOM_SEGS);

  for (const [elem, list] of Object.entries(byElem)) {
    const col = elemColors[elem] ? elemColors[elem].clone() : new THREE.Color(0xcccccc);
    const mat = new THREE.MeshStandardMaterial({
      color: col,
      roughness: 0.32,
      metalness: 0.08,
      emissive: col.clone().multiplyScalar(0.06),
    });

    const mesh = new THREE.InstancedMesh(unitGeo, mat, list.length);
    list.forEach((a, ii) => {
      const r = (a.r || (elemRadii[a.e] || 0.8)) * atomScale;
      dummy.position.set(a.x, a.y, a.z);
      dummy.scale.setScalar(r);
      dummy.updateMatrix();
      mesh.setMatrixAt(ii, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    crystalGroup.add(mesh);
    atomMeshes.push(mesh);
  }
}

function buildTiledBonds(atoms, s) {
  // Use distance-based bonding: pairs within 1.1× the bond lengths found in original data
  // For speed, use a spatial hash
  if (!showBonds) return;

  // Determine max bond length from original bonds
  let maxBondLen = 0;
  for (const [bi, bj] of s.bonds) {
    const a1 = s.atoms[bi], a2 = s.atoms[bj];
    const d = Math.sqrt((a1.x-a2.x)**2 + (a1.y-a2.y)**2 + (a1.z-a2.z)**2);
    if (d > maxBondLen) maxBondLen = d;
  }
  if (maxBondLen === 0) maxBondLen = 2.5;
  const cutoff = maxBondLen * 1.05;

  // Get bonded element pairs from original data
  const bondPairs = new Set();
  for (const [bi, bj] of s.bonds) {
    const pair = [s.atoms[bi].e, s.atoms[bj].e].sort().join('-');
    bondPairs.add(pair);
  }

  // Spatial hash
  const cellSize = cutoff;
  const grid = new Map();
  atoms.forEach((a, i) => {
    const cx = Math.floor(a.x / cellSize);
    const cy = Math.floor(a.y / cellSize);
    const cz = Math.floor(a.z / cellSize);
    const key = `${cx},${cy},${cz}`;
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  });

  const bonds = [];
  const cutoff2 = cutoff * cutoff;

  for (let i = 0; i < atoms.length; i++) {
    const a = atoms[i];
    const cx = Math.floor(a.x / cellSize);
    const cy = Math.floor(a.y / cellSize);
    const cz = Math.floor(a.z / cellSize);

    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dz = -1; dz <= 1; dz++) {
          const nk = `${cx+dx},${cy+dy},${cz+dz}`;
          const cell = grid.get(nk);
          if (!cell) continue;
          for (const j of cell) {
            if (j <= i) continue;
            const b = atoms[j];
            const d2 = (a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2;
            if (d2 > cutoff2) continue;
            const pair = [a.e, b.e].sort().join('-');
            if (!bondPairs.has(pair)) continue;
            bonds.push([i, j]);
          }
        }
      }
    }
  }

  if (!bonds.length) return;

  const bondGeo = new THREE.CylinderGeometry(BOND_R, BOND_R, 1, BOND_SEGS);
  bondGeo.translate(0, 0.5, 0);
  bondGeo.rotateX(Math.PI / 2);

  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.5, metalness: 0.05,
    transparent: true, opacity: 0.55,
  });

  bondMesh = new THREE.InstancedMesh(bondGeo, mat, bonds.length);
  const colorAttr = new THREE.InstancedBufferAttribute(new Float32Array(bonds.length * 3), 3);
  const dummy = new THREE.Object3D();
  const p1 = new THREE.Vector3(), p2 = new THREE.Vector3();

  bonds.forEach(([bi, bj], ii) => {
    const a1 = atoms[bi], a2 = atoms[bj];
    p1.set(a1.x, a1.y, a1.z);
    p2.set(a2.x, a2.y, a2.z);
    const len = p1.distanceTo(p2);
    dummy.position.copy(p1);
    dummy.scale.set(1, 1, len);
    dummy.lookAt(p2);
    dummy.updateMatrix();
    bondMesh.setMatrixAt(ii, dummy.matrix);

    const pair = [a1.e, a2.e].sort().join('-');
    const col = bondColorMap[pair] || new THREE.Color(0x555555);
    colorAttr.setXYZ(ii, col.r, col.g, col.b);
  });

  bondMesh.instanceMatrix.needsUpdate = true;
  bondMesh.instanceColor = colorAttr;
  bondMesh.visible = showBonds;
  crystalGroup.add(bondMesh);
}

function buildTiledCellWireframe(va, vb, vc, R, center) {
  const points = [];
  for (let ix = 0; ix <= R; ix++) {
    for (let iy = 0; iy <= R; iy++) {
      for (let iz = 0; iz <= R; iz++) {
        const corner = new THREE.Vector3()
          .addScaledVector(va, ix)
          .addScaledVector(vb, iy)
          .addScaledVector(vc, iz)
          .sub(center);
        if (ix < R) { points.push(corner.clone()); points.push(corner.clone().add(va)); }
        if (iy < R) { points.push(corner.clone()); points.push(corner.clone().add(vb)); }
        if (iz < R) { points.push(corner.clone()); points.push(corner.clone().add(vc)); }
      }
    }
  }

  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: 0x3a3a4a, transparent: true, opacity: 0.25 });
  cellLine = new THREE.LineSegments(geo, mat);
  cellLine.visible = showCell;
  crystalGroup.add(cellLine);
}

function buildLegend(atoms) {
  const elems = [...new Set(atoms.map(a => a.e))].sort();
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  for (const e of elems) {
    const col = elemColors[e] || new THREE.Color(0xcccccc);
    const hex = '#' + col.getHexString();
    const info = data.elements[e];
    const label = info ? `${e} — ${info.name}` : e;
    legend.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${hex}"></div>${label}</div>`;
  }
}

/* ── Animate ───────────────────────────────────────────────── */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

/* ── Go ────────────────────────────────────────────────────── */
init();
</script>
